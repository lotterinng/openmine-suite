name: Windows

# Builds OpenMine Suite with MSVC + vcpkg, runs the tests and the GUI smoke test, and packages the
# Windows installer (Inno Setup). The installer is uploaded as an artifact on every run and
# attached to a GitHub release when a tag v* is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes that only concern the Linux jobs or packages do not rebuild Windows.
    paths-ignore:
      - ".github/workflows/ci.yml"
      - ".github/scripts/logged.sh"
      - "packaging/linux/**"
  pull_request:
  workflow_dispatch:

# A newer push waits for the running build (its vcpkg binary cache is saved when it ends).
concurrency:
  group: windows-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # releases for tags

env:
  VCPKG_TAG: 2024.11.16          # pinned vcpkg ports
  # MSYS2 deletes superseded packages from its mirrors, so the MSYS2 package list of an older vcpkg
  # (used to fetch pkgconf for every port) goes stale; it is taken from this newer vcpkg release.
  VCPKG_MSYS_TAG: 2026.10.16
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  windows:
    name: Windows — build, test, installer
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The developer environment points VCPKG_ROOT at Visual Studio's bundled vcpkg; this build
      # uses its own clone at the pinned tag.
      - name: Use the pinned vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ env.VCPKG_TAG }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          ./.github/scripts/logged.ps1 -Name bootstrap -Script {
            $PSVersionTable.PSVersion.ToString(); git --version
            Get-Command cmake, ninja, cl -ErrorAction Continue | ForEach-Object { "$($_.Name): $($_.Source)" }
            "workspace: $env:GITHUB_WORKSPACE  VCPKG_ROOT: $env:VCPKG_ROOT  cache: $env:VCPKG_DEFAULT_BINARY_CACHE"
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            if (Test-Path "$env:VCPKG_ROOT\.git") { "vcpkg already present" } else {
              git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
              if ($LASTEXITCODE) { throw "git clone of vcpkg $env:VCPKG_TAG failed ($LASTEXITCODE)" }
            }
            # Current MSYS2 package list (same functions; only the package URLs, hashes and
            # dependencies differ). Its download helper was renamed later; map it back.
            git -C $env:VCPKG_ROOT fetch --depth 1 origin tag $env:VCPKG_MSYS_TAG
            if ($LASTEXITCODE) { throw "git fetch of vcpkg $env:VCPKG_MSYS_TAG failed ($LASTEXITCODE)" }
            $msys = git -C $env:VCPKG_ROOT show "${env:VCPKG_MSYS_TAG}:scripts/cmake/vcpkg_acquire_msys.cmake"
            if ($LASTEXITCODE) { throw "vcpkg_acquire_msys.cmake not found in $env:VCPKG_MSYS_TAG" }
            ($msys -join "`n").Replace('z_vcpkg_download_distfile(', 'vcpkg_download_distfile(') |
              Set-Content -NoNewline -Encoding utf8NoBOM "$env:VCPKG_ROOT\scripts\cmake\vcpkg_acquire_msys.cmake"
            git -C $env:VCPKG_ROOT --no-pager diff --stat
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE) { throw "bootstrap-vcpkg.bat failed ($LASTEXITCODE)" }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
          }

      - name: Configure (installs the vcpkg dependencies; hours on the first run)
        shell: pwsh
        run: |
          ./.github/scripts/logged.ps1 -Name configure -Grep 'error|failed|CMake Error' -Script {
            # Source downloads from hosts that rate-limit (HTTP 429) or fail transiently are retried;
            # packages already built are kept, so a retry continues where the last attempt stopped.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              cmake --preset windows-msvc `
                -DOPENMINE_BUILD_PYTHON=OFF -DOPENMINE_WITH_OPEN3D=OFF -DOPENMINE_WITH_ORTOOLS=OFF `
                -DOPENMINE_BUILD_BENCHMARKS=OFF 2>&1 | Tee-Object -Variable configureOutput
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -lt 3 -and ($configureOutput -match 'Failed to download|status code (429|5\d\d)')) {
                "download failure (attempt $attempt); retrying in 3 minutes"
                Start-Sleep -Seconds 180
                continue
              }
              throw "configure failed (exit $LASTEXITCODE)"
            }
          }

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: |
            vcpkg/buildtrees/**/*.log
            build/windows-msvc/vcpkg-manifest-install.log
          if-no-files-found: ignore

      - name: Build
        shell: pwsh
        run: |
          # -k 0: keep going after a failing translation unit, so one run reports every error.
          ./.github/scripts/logged.ps1 -Name build -Grep 'error C\d|error LNK|fatal error' -Script {
            cmake --build --preset windows-msvc -- -k 0
          }

      - name: Python tools for the validation tests
        shell: pwsh
        run: python -m pip install pytest numpy ezdxf trimesh omf mplstereonet pypdf pdfplumber openpyxl

      - name: Tests (headless)
        shell: pwsh
        run: |
          $vi = "${{ github.workspace }}\build\windows-msvc\vcpkg_installed\x64-windows"
          $env:QT_PLUGIN_PATH = "$vi\Qt6\plugins"
          $env:PROJ_DATA = "$vi\share\proj"
          $env:GDAL_DATA = "$vi\share\gdal"
          $env:PDAL_DRIVER_PATH = "$vi\bin"      # PDAL's format plugins (E57)
          # The plugins' own dependencies (E57 needs Xerces-C) are found on PATH; the installed
          # application has every vcpkg DLL next to the executable instead.
          $env:PATH = "$vi\bin;$env:PATH"
          ./.github/scripts/logged.ps1 -Name tests -Tail 40 -Grep '\*\*\*Failed|\*\*\*Exception|Timeout|\[  FAILED|Failure|Error|error' -Script {
            ctest --preset windows-msvc -LE gui --timeout 1800
          }

      - name: Mesa OpenGL for the smoke test (the runner has no GPU driver with OpenGL 3.2)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir mesa
          7z x (Get-ChildItem mesa\*.7z | Select-Object -First 1).FullName -omesa\x -y | Out-Null
          Copy-Item mesa\x\x64\*.dll build\windows-msvc\bin\

      - name: GUI smoke test
        shell: pwsh
        run: |
          $vi = "${{ github.workspace }}\build\windows-msvc\vcpkg_installed\x64-windows"
          $env:QT_PLUGIN_PATH = "$vi\Qt6\plugins"
          $env:PROJ_DATA = "$vi\share\proj"
          $env:GDAL_DATA = "$vi\share\gdal"
          $env:PDAL_DRIVER_PATH = "$vi\bin"      # PDAL's format plugins (E57)
          # The plugins' own dependencies (E57 needs Xerces-C) are found on PATH; the installed
          # application has every vcpkg DLL next to the executable instead.
          $env:PATH = "$vi\bin;$env:PATH"
          ./.github/scripts/logged.ps1 -Name smoke -Tail 40 -Grep 'FAIL|Failed|Error|error' -Script {
            ctest --preset windows-msvc -L gui --timeout 1800
            if ($LASTEXITCODE -and (Test-Path build\windows-msvc\gui-smoke\smoke.log)) {
              $code = $LASTEXITCODE
              "---- end of smoke.log"
              Get-Content build\windows-msvc\gui-smoke\smoke.log -Tail 30
              $global:LASTEXITCODE = $code
            }
          }
          $summary = (Get-Content build\windows-msvc\gui-smoke\smoke.log | Select-String -Pattern '^\d+ passed, ' | Select-Object -Last 1).Line
          $skips = @(Get-Content build\windows-msvc\gui-smoke\smoke.log | Select-String -Pattern '^SKIP ' | ForEach-Object { $_.Line }) -join '%0A'
          "::notice title=GUI smoke test (build tree)::$summary%0A$skips"

      - name: Upload smoke-test log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-smoke
          path: build/windows-msvc/gui-smoke/
          if-no-files-found: ignore

      - name: Stage the application (without the test-only Mesa DLLs)
        shell: pwsh
        run: |
          Get-ChildItem mesa\x\x64\*.dll | ForEach-Object { Remove-Item -ErrorAction SilentlyContinue "build\windows-msvc\bin\$($_.Name)" }
          ./.github/scripts/logged.ps1 -Name stage -Script {
            ./packaging/windows/stage.ps1 -Build build/windows-msvc -Out stage
          }

      - name: Check the staged application starts
        shell: pwsh
        run: |
          # Runs the staged copy with nothing from the build or vcpkg trees on PATH. A missing DLL or
          # Qt plugin would otherwise open a message box and wait forever, so the run has a time
          # limit and Qt reports to stderr.
          $out = "$env:RUNNER_TEMP\staged-out.txt"; $err = "$env:RUNNER_TEMP\staged-err.txt"
          $p = Start-Process -FilePath stage\openmine-desktop.exe -ArgumentList "--command-reference", "$env:RUNNER_TEMP\commands.md" `
                 -PassThru -RedirectStandardOutput $out -RedirectStandardError $err `
                 -Environment @{ QT_QPA_PLATFORM = "offscreen"; QT_FORCE_STDERR_LOGGING = "1"; QT_PLUGIN_PATH = "" }
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "the staged application did not finish within 3 minutes (a dialog may have opened: missing DLL or Qt plugin)"
          }
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\commands.md")) { throw "the staged application did not run (exit $($p.ExitCode))" }
          "staged application ran: $((Get-Content "$env:RUNNER_TEMP\commands.md").Count) lines of command reference"

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(OpenMineSuite VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          ./.github/scripts/logged.ps1 -Name installer -Script {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DStage=$PWD\stage" "/DOutputDir=$PWD\dist" packaging\windows\openmine-suite.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          }
          Get-ChildItem dist

      - name: Install, run the installed application's smoke test, uninstall
        shell: pwsh
        run: |
          ./.github/scripts/logged.ps1 -Name installed -Tail 40 -Script {
            $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
            $dir = "$env:RUNNER_TEMP\OpenMine Suite"
            $p = Start-Process $setup -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"", '/TASKS=associate', "/LOG=`"$env:RUNNER_TEMP\setup.log`""
            if (-not $p.WaitForExit(600000)) { throw "setup did not finish within 10 minutes" }
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "setup failed (exit $($p.ExitCode))" }
            "installed $((Get-ChildItem -Recurse $dir | Measure-Object).Count) files in $dir"
            # Test only: OpenGL 3.2 in software, since the runner has no GPU driver. Removed below.
            $mesa = Get-ChildItem mesa\x\x64\*.dll
            $mesa | Copy-Item -Destination $dir
            # The installed copy, with nothing from the build or vcpkg trees on PATH or in Qt's paths.
            $out = "$env:RUNNER_TEMP\installed-smoke"
            $env:QT_PLUGIN_PATH = ''; $env:PROJ_DATA = ''; $env:GDAL_DATA = ''; $env:PDAL_DRIVER_PATH = ''; $env:OPENMINE_PLUGIN_PATH = ''
            $env:QT_FORCE_STDERR_LOGGING = '1'
            $app = Start-Process "$dir\openmine-desktop.exe" -PassThru -ArgumentList '--smoke-test', "`"$out`"" `
                     -RedirectStandardOutput "$env:RUNNER_TEMP\installed-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\installed-err.txt"
            if (-not $app.WaitForExit(1800000)) { Stop-Process -Id $app.Id -Force; throw "the installed application's smoke test did not finish within 30 minutes" }
            $log = Join-Path $out 'smoke.log'
            $summary = if (Test-Path $log) { (Get-Content $log | Select-String -Pattern '^\d+ passed, ' | Select-Object -Last 1).Line } else { 'no smoke.log' }
            $skips = if (Test-Path $log) { @(Get-Content $log | Select-String -Pattern '^SKIP ' | ForEach-Object { $_.Line }) -join '%0A' } else { '' }
            "::notice title=GUI smoke test (installed application)::$summary%0A$skips"
            if ($app.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log | Select-String -Pattern '^FAIL ' | ForEach-Object { $_.Line } }
              Get-Content "$env:RUNNER_TEMP\installed-err.txt" -Tail 20 -ErrorAction SilentlyContinue
              throw "the installed application's smoke test failed (exit $($app.ExitCode)): $summary"
            }
            $mesa | ForEach-Object { Remove-Item (Join-Path $dir $_.Name) }
            # Uninstall: the uninstaller runs a copy of itself and returns at once; wait for the folder.
            $u = Start-Process "$dir\unins000.exe" -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            $u.WaitForExit(300000) | Out-Null
            $deadline = (Get-Date).AddMinutes(3)
            while ((Test-Path "$dir\openmine-desktop.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            if (Test-Path "$dir\openmine-desktop.exe") { throw "uninstall left the application in place" }
            $left = @(Get-ChildItem -Recurse $dir -ErrorAction SilentlyContinue)
            if ($left.Count) { "left after uninstall (files the application created): $($left.FullName -join ', ')" }
            if (Test-Path 'HKCU:\Software\Classes\OpenMineSuite.Project') { throw "uninstall left the .openmine file association" }
            "installed, smoke-tested and uninstalled"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenMine-Suite-Windows-Installer
          path: dist/*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
